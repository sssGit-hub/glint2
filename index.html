<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glint — Wikidata edition</title>
<style>
:root{color-scheme:dark;--bg:#0a0c14;--card:#131726;--line:#252b43;--ink:#f1f3fb;--mute:#8c94b3;--c:#8b93a5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(ellipse at 50% -10%,#1d2250 0,var(--bg) 60%) fixed;color:var(--ink);font:16px/1.4 system-ui,-apple-system,sans-serif;min-height:100vh}
.w{max-width:560px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{margin:0;font-size:26px;letter-spacing:6px;font-weight:800}h1 b{color:#b26bff}
.hoard{text-align:right;font-size:12px;color:var(--mute);letter-spacing:2px;text-transform:uppercase}.hoard b{display:block;font-size:24px;color:var(--ink);letter-spacing:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px}
.k{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--mute)}
.p{font-size:25px;font-weight:700;line-height:1.2;margin:8px 0 2px}
.row{display:flex;gap:8px;margin-top:16px}
input{flex:1;min-width:0;font:inherit;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0c1020;color:var(--ink)}
input:focus{outline:2px solid #b26bff}
button{font:700 15px system-ui,sans-serif;padding:13px 20px;border:0;border-radius:12px;background:linear-gradient(135deg,#7c5cff,#d65cff);color:#fff;cursor:pointer}
button.g{background:none;border:1px solid var(--line);color:var(--mute)}
.pips{display:flex;gap:6px;margin-top:12px;align-items:center;font-size:12px;color:var(--mute)}.pip{width:10px;height:10px;border-radius:50%;background:#7c5cff}.pip.x{background:#3a2030}
.msg{color:#ff7a8a;margin-top:12px;font-size:14px}
.rv{text-align:center;position:relative;overflow:hidden;border-color:var(--c);box-shadow:0 0 40px -8px var(--c) inset,0 0 30px -10px var(--c)}
.gem{width:150px;margin:6px auto 0;color:var(--c);filter:drop-shadow(0 0 22px var(--c));animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
.gem.mythic{animation:pop .7s cubic-bezier(.2,1.6,.4,1),hue 4s linear infinite .7s}
@keyframes pop{from{transform:scale(.1) rotate(-40deg);opacity:0}}
@keyframes hue{to{filter:drop-shadow(0 0 26px currentColor) hue-rotate(360deg)}}
.tier{font-size:38px;font-weight:900;letter-spacing:5px;text-transform:uppercase;color:var(--c);text-shadow:0 0 24px var(--c);margin-top:6px;animation:fade .6s .25s both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.ans{font-size:22px;font-weight:700;margin:2px 0}
.odds{font-size:15px;color:var(--mute)}.odds b{color:var(--ink);font-size:20px}
.meter{display:flex;gap:4px;margin:16px 0 6px}.meter i{flex:1;height:8px;border-radius:4px;background:#1f2540}.meter i.on{box-shadow:0 0 10px currentColor}
.fl{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,var(--c),transparent 65%);animation:fl 1s forwards}
@keyframes fl{from{opacity:.7}to{opacity:0}}
.tip{font-size:13px;color:var(--mute);margin-top:12px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px}
.sl{text-align:center;font-size:12px;color:var(--mute)}.sl svg{width:46px;color:var(--c);filter:drop-shadow(0 0 8px var(--c))}.sl b{display:block;color:var(--ink);font-size:13px}
.big{font-size:44px;font-weight:900}
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
.rv.mx{border:2px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,conic-gradient(from var(--a),#ff3b3b,#ffd23b,#3bff8a,#3bd7ff,#b26bff,#ff4fa3,#ff3b3b) border-box;animation:spin 4s linear infinite;box-shadow:0 0 50px -8px #ff4fa3}
@keyframes spin{to{--a:360deg}}
.tier.mx{background:linear-gradient(90deg,#ff3b3b,#ffd23b,#3bff8a,#3bd7ff,#b26bff,#ff4fa3,#ff3b3b);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;animation:fade .6s .25s both,slide 3s linear infinite}
@keyframes slide{to{background-position:-200% 0}}
svg.ch{animation:hue2 4s linear infinite}@keyframes hue2{to{filter:hue-rotate(360deg)}}
.fl.mx{background:conic-gradient(#ff3b3b,#ffd23b,#3bff8a,#3bd7ff,#b26bff,#ff4fa3,#ff3b3b);filter:blur(50px)}
.meter i.mxb.on{background:linear-gradient(90deg,#ff3b3b,#ffd23b,#3bff8a,#3bd7ff,#b26bff,#ff4fa3)!important}
.src{font-size:12px;color:var(--mute);margin-top:6px}
</style></head><body>
<div class="w"><header><h1>GL<b>I</b>NT</h1><div class="hoard">Hoard<b id="h">0</b></div></header><div id="m"></div></div>
<script>
const TIERS=[[0,"Common","#8b93a5"],[25,"Uncommon","#3ddc84"],[45,"Rare","#3b9cff"],[63,"Epic","#b26bff"],[80,"Legendary","#ffb020"],[93,"Mythic","#ff4fa3"]];
const tierOf=r=>[...TIERS].reverse().find(t=>r>=t[0]);
const $=i=>document.getElementById(i),rnd=a=>a[Math.floor(Math.random()*a.length)];
const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/^(a|an|the) /,"").trim();
const lev=(a,b)=>{let p=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[b.length]};
const MC="#ff4fa3",DEF=`<defs><linearGradient id="rb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3b3b"/><stop offset=".2" stop-color="#ffd23b"/><stop offset=".4" stop-color="#3bff8a"/><stop offset=".6" stop-color="#3bd7ff"/><stop offset=".8" stop-color="#b26bff"/><stop offset="1" stop-color="#ff4fa3"/></linearGradient></defs>`;
const gem=c=>`<svg viewBox="0 0 100 90" class="${c===MC?"ch":""}" style="color:${c}">${c===MC?DEF:""}<polygon points="20,8 80,8 98,34 50,88 2,34" fill="${c===MC?"url(#rb)":"currentColor"}"/><polygon points="20,8 80,8 66,34 34,34" fill="#fff" opacity=".4"/><polygon points="20,8 34,34 2,34" fill="#000" opacity=".15"/><polygon points="80,8 98,34 66,34" fill="#000" opacity=".28"/><polygon points="2,34 34,34 50,88" fill="#fff" opacity=".12"/><polygon points="34,34 66,34 50,88" fill="#fff" opacity=".3"/><polygon points="66,34 98,34 50,88" fill="#000" opacity=".32"/></svg>`;
// ---- tuning: log10(yearly English-Wikipedia views) mapped to rarity. HI = 0 rarity, LO = 100 rarity
const HI=6.7,LO=3.0;
const WD="https://www.wikidata.org/w/api.php",QS="https://query.wikidata.org/sparql";
// Two-ocean list is local because Wikidata coastline data is patchy
const OC2=["United States","Canada","Mexico","Colombia","Panama","Costa Rica","Guatemala","Honduras","Nicaragua","Russia","South Africa","Indonesia","Australia","Malaysia","Norway","Iceland"];
const ID=a=>a.map(i=>"wd:"+i).join(" ");
const IS=ids=>"?x wdt:P31/wdt:P279* ?c. VALUES ?c{"+ID(ids)+"}";
const TX=(t,ids)=>({t,q:"?x (wdt:P31|wdt:P279|wdt:P171)+ ?d. VALUES ?d{"+ID(ids)+"}"});
const CO=(t,id)=>({t,q:"?x wdt:P30 wd:"+id});
const cl=(n,ids,big)=>({n,q:IS(ids),fs:[],big});
// Wikidata class IDs live here. If a category misbehaves, fix its Q-number.
const P=[
{n:"a country",q:"?x wdt:P31 wd:Q3624078",big:1,fs:[{t:"with a coastline on two oceans",local:OC2},{t:"that is landlocked",q:"?x wdt:P31 wd:Q123480"},{t:"that is an island nation",q:"?x wdt:P31 wd:Q112099"},CO("in Africa","Q15"),CO("in Asia","Q48"),CO("in Europe","Q46"),CO("in North America","Q49"),CO("in South America","Q18"),CO("in Oceania","Q538")]},
{n:"an animal",q:"?x (wdt:P31|wdt:P279|wdt:P171)+ wd:Q729",big:1,fs:[TX("that is a mammal",["Q7377"]),TX("that is a bird",["Q5113"]),TX("that is a reptile",["Q10811"]),TX("that is an insect",["Q1390"]),TX("that is an amphibian",["Q10908"]),TX("that is a fish",["Q152","Q127282"])]},
cl("a fruit",["Q3314483","Q1364"],1),cl("a vegetable",["Q11004"],1),cl("a river",["Q4022"],1),cl("a mountain",["Q8502"],1),cl("an island",["Q23442"],1),cl("a city",["Q515"],1),cl("a language",["Q34770"],1),cl("a dog breed",["Q39367"],1),cl("a sport",["Q349"],1),cl("a musical instrument",["Q34379"]),cl("a programming language",["Q9143"],1),cl("a chemical element",["Q11344"]),cl("a currency",["Q8142"]),cl("a musical genre",["Q188451"],1),cl("a lake",["Q23397"],1),cl("a volcano",["Q8072"]),cl("a desert",["Q8514"]),cl("a capital city",["Q5119"],1)];
let G={busy:0};
function gen(){for(let i=0;i<99;i++){const p=rnd(P),f=p.fs.length&&Math.random()<.7?rnd(p.fs):null,L=p.big&&(!f||Math.random()<.4)?rnd([..."ABCDEFGHKLMNPRSTW"]):null,key=p.n+(f?f.t:"")+L;if(G.keys.includes(key))continue;G.keys.push(key);return{p,f,L,text:"Name "+p.n+(f?" "+f.t:"")+(L?(f?" and":" that")+" starts with “"+L+"”":"")}}return null}
function start(){G={i:0,hoard:0,hist:[],keys:[],used:[],lives:3,q:null,busy:0};$("h").textContent=0;ask()}
function ask(){G.q=gen();G.lives=3;
 $("m").innerHTML=`<div class="card"><div class="k">Round ${G.i+1} of 6</div><div class="p">${G.q.text}</div>
 <div class="row"><input id="a" placeholder="Name it…" autocomplete="off" maxlength="60"><button id="s">Reveal</button></div>
 <div class="pips" id="pp"></div><div class="msg" id="e"></div><div class="row"><button class="g" id="sk">Skip</button></div></div>`;pips();
 $("s").onclick=go;$("a").onkeydown=e=>{if(e.key==="Enter")go()};$("sk").onclick=()=>{G.hist.push({a:"(skipped)",r:0,t:TIERS[0]});nx()};$("a").focus()}
function pips(){$("pp").innerHTML="Lives "+[0,1,2].map(i=>`<span class="pip ${i<G.lives?"":"x"}"></span>`).join("")}
async function views(t){if(!t)return 800;const d=new Date(),f=x=>x.getFullYear()+String(x.getMonth()+1).padStart(2,"0")+"0100";
 try{const r=await fetch("https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/en.wikipedia/all-access/user/"+encodeURIComponent(t.replace(/ /g,"_"))+"/monthly/"+f(new Date(d.getFullYear()-1,d.getMonth(),1))+"/"+f(new Date(d.getFullYear(),d.getMonth(),1)));const j=await r.json();return j.items.reduce((a,x)=>a+x.views,0)||800}catch(_){return 800}}
const fmtV=v=>v>=1e6?(v/1e6).toFixed(1)+"M":v>=1e3?Math.round(v/1e3)+"k":v;
async function go(){if(G.busy)return;const a=$("a").value.trim();if(!a)return;const q=G.q,nn=norm(a);
 if(G.used.includes(nn)){$("e").textContent="Already used that one.";return}
 const bad=m=>{G.lives--;pips();$("e").textContent=m;$("a").value="";$("a").focus();if(G.lives<=0){G.hist.push({a:"(no valid answer)",r:0,t:TIERS[0]});setTimeout(nx,1300)}};
 if(q.L&&nn[0]!==q.L.toLowerCase())return bad("It has to start with “"+q.L+"”.");
 G.busy=1;$("s").disabled=true;$("s").textContent="Checking…";$("e").textContent="";
 try{
  const sj=await(await fetch(WD+"?action=wbsearchentities&type=item&language=en&uselang=en&limit=6&format=json&origin=*&search="+encodeURIComponent(a))).json();
  const c=(sj.search||[]).map(x=>x.id);
  if(!c.length)return bad("Wikidata has never heard of that.");
  const sq=`SELECT ?x ?l ?t WHERE{VALUES ?x{${ID(c)}} ${q.p.q} ${(q.f&&q.f.q)||""} ?x rdfs:label ?l. FILTER(LANG(?l)="en") OPTIONAL{?a schema:about ?x;schema:isPartOf <https://en.wikipedia.org/>;schema:name ?t}}`;
  const rj=await(await fetch(QS+"?format=json&query="+encodeURIComponent(sq))).json();
  const rows=rj.results.bindings.map(b=>({id:b.x.value.split("/").pop(),l:b.l.value,t:b.t&&b.t.value})).filter(r=>!q.f||!q.f.local||q.f.local.map(norm).includes(norm(r.l))).sort((x,y)=>c.indexOf(x.id)-c.indexOf(y.id));
  const hit=rows[0];
  if(!hit)return bad("Couldn’t confirm that’s "+q.p.n+(q.f?" "+q.f.t:"")+" (checked "+c.length+" Wikidata matches).");
  if(G.used.includes(hit.id)){$("e").textContent="Already used that one.";return}
  G.used.push(nn,hit.id);
  const v=await views(hit.t),r=Math.max(0,Math.min(100,Math.round((HI-Math.log10(v))/(HI-LO)*100))),t=tierOf(r),n=Math.max(2,Math.round(2*Math.pow(10,r/40))),mx=t[1]==="Mythic"?"mx":"";
  G.hoard+=r;$("h").textContent=G.hoard;G.hist.push({a:hit.l,r,t});
  $("m").innerHTML=`<div class="fl ${mx}" style="--c:${t[2]}"></div><div class="card rv ${mx}" style="--c:${t[2]}"><div class="gem ${mx?"mythic":""}">${gem(t[2])}</div><div class="tier ${mx}">${t[1]}</div><div class="ans">${hit.l}</div>
  <div class="odds">Rarity <b>${r}</b>/100 · est. <b>1 in ${n}</b> players</div><div class="meter" style="color:${t[2]}">${TIERS.map((x,i)=>`<i class="${r>=x[0]?"on":""} ${x[1]==="Mythic"?"mxb":""}" style="background:${r>=x[0]?x[2]:""}"></i>`).join("")}</div>
  <div class="src">~${fmtV(v)} Wikipedia views in the last year</div><div class="row" style="justify-content:center"><button id="n">${G.i<5?"Next prompt":"Open the vault"}</button></div></div>`;
  $("n").onclick=nx;
 }catch(err){console.error(err);$("e").textContent="Couldn’t reach Wikidata or Wikipedia. Check your connection and try again."}
 finally{G.busy=0;const s=$("s");if(s){s.disabled=false;s.textContent="Reveal"}}}
function nx(){G.i++;G.i<6?ask():end()}
function shelf(){return `<div class="shelf">${[...G.hist].sort((a,b)=>b.r-a.r).map(h=>`<div class="sl" style="--c:${h.t[2]}">${gem(h.t[2])}<b>${h.a}</b>${h.t[1]} · ${h.r}</div>`).join("")}</div>`}
function end(){const best=[...G.hist].sort((a,b)=>b.r-a.r)[0];
 $("m").innerHTML=`<div class="card rv ${best.t[1]==="Mythic"?"mx":""}" style="--c:${best.t[2]}"><div class="k">Final hoard</div><div class="big">${G.hoard}</div><div class="gem" style="margin-top:0">${gem(best.t[2])}</div><div class="tier ${best.t[1]==="Mythic"?"mx":""}" style="font-size:26px">${best.t[1]}</div><div class="ans">Best find: ${best.a}</div><div class="row" style="justify-content:center"><button id="n">Hunt again</button></div></div><div class="card"><div class="k" style="margin-bottom:12px">Your vault</div>${shelf()}</div>`;$("n").onclick=start}
$("m").innerHTML=`<div class="card" style="text-align:center"><div class="k">Name it. Fit it. Find the rare.</div><div class="gem" style="--c:#b26bff;margin:14px auto">${gem("#b26bff")}</div><p>Six prompts. Every answer is checked against Wikidata, so anything real that fits counts. Rarity comes from how rarely people look it up on Wikipedia.</p><button id="n">Start hunting</button></div>`;$("n").onclick=start;
</script></body></html>
